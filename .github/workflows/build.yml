name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          mkdir proj
          if [ -f MJSkyTrack.zip ]; then
            unzip -q MJSkyTrack.zip -d proj
          else
            rsync -a --exclude proj --exclude .git ./ proj/
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MJ-SkyTrack-APK
          path: proj/app/build/outputs/apk/debug/*.apk
